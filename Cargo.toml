[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/agent",
    "crates/app-core",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
jiff = { version = "0.1", features = ["serde"] }
rcgen = { version = "0.13", features = ["x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pki-types = "1"
time = "0.3"
sha2 = "0.10"
pem = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "fs", "sync"] }
axum = "0.8"
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
rustls-pemfile = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-manual-roots"] }
clap = { version = "4", features = ["derive"] }
mdns-sd = "0.13"
notify = "7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
self-replace = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
rand = "0.9"
age = { version = "0.11", features = ["armor"] }

[workspace]
# Standalone: not part of the root crates/ workspace (different platform
# constraints — this crate needs a webview toolkit installed, the others
# don't), so it declares itself as workspace root to avoid ambiguity.

[package]
name = "homeguard"
version = "0.2.0"
edition = "2021"
license = "MIT"
default-run = "homeguard"

[lib]
name = "homeguard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
homeguard-app-core = { path = "../../crates/app-core" }
homeguard-common = { path = "../../crates/common" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
rustls-pki-types = "1"
jiff = { version = "0.1", features = ["serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"

[features]
custom-protocol = ["tauri/custom-protocol"]
